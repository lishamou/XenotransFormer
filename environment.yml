# XenotransFormer — Conda environment specification
# Reproduces the full computational pipeline reported in the paper
# (XenotransFormer: Cross-Dataset and Cross-Species Cell Type Recognition in
#  Pig-to-Primate Xenotransplantation from TranscriptFormer Embeddings, 2026).
#
# Usage (recommended for full reproducibility):
#   conda env create -f environment.yml
#   conda activate xenotransformer
#   bash scripts/install_local_pip_overrides.sh  # pip installs the
#                                                # xenotransformer package
#                                                # itself + TranscriptFormer
#                                                # (CZI Biohub) from local
#                                                # source checkouts
#
# Verified on:
#   - Linux x86_64 (Ubuntu 22.04), CUDA 12.4, NVIDIA A100 80GB / V100 32GB
#   - macOS 14 (Apple Silicon, CPU-only embedding extraction; figure
#     generation works, embedding inference is ~30× slower)
#
# This is a hybrid conda + pip environment. Conda manages the heavy
# native dependencies (PyTorch, CUDA, HDF5, BLAS, geos). Pip installs
# the in-house packages (xenotransformer, TranscriptFormer) and
# domain-specific utilities not on conda-forge.

name: xenotransformer
channels:
  - pytorch
  - nvidia
  - conda-forge
  - bioconda
  - defaults

dependencies:
  # ===== Core language + system =====
  - python=3.11.9
  - pip=24.0
  - wheel=0.43.0
  - setuptools=70.0.0
  - git=2.45.2
  - curl=8.8.0
  - ca-certificates=2024.7.2
  - openssl=3.3.1

  # ===== Native scientific stack (conda-forge) =====
  - numpy=2.2.6
  - scipy=1.15.3
  - pandas=2.2.2
  - scikit-learn=1.6.1
  - h5py=3.14.0
  - hdf5=1.14.5
  - anndata=0.11.4
  - scanpy=1.11.2
  - umap-learn=0.5.7
  - matplotlib=3.10.3
  - seaborn=0.13.2
  - pyyaml=6.0.2
  - tqdm=4.67.1
  - requests=2.32.3
  - boto3=1.38.27
  - psutil=7.0.0
  - jupyter=1.1.1
  - ipykernel=6.29.5
  - black=25.1.0
  - ruff=0.8.4

  # ===== Heavy ML (PyTorch + CUDA — conda pytorch channel) =====
  - pytorch=2.5.1
  - pytorch-cuda=12.4.1
  - pytorch-lightning=2.5.1
  - nvidia/label/cuda-12.4.1::cuda-toolkit=12.4.1
  - nvidia/label/cuda-12.4.1::cuda-cudart=12.4.108
  - nvidia/label/cuda-12.4.1::cuda-nvrtc=12.4.127
  - cudnn=9.2.1
  - nccl=2.23.4

  # ===== Optional CPU fallback (for Apple Silicon / dev) =====
  - nomkl=4.0.0
  - llvm-openmp=18.1.8

  # ===== Pip overrides (in-house + niche) =====
  - pip:
      # In-house: the XenotransFormer framework itself
      - -e ./xenotransformer_pkg
      # CZI Biohub TranscriptFormer (frozen, inference only)
      - git+https://github.com/czi-bio/Transcription-Foundation-Model.git@v2026.03.0
      # Domain-specific utilities not on conda-forge
      - timeout-decorator==0.5.0
      - pynvml==12.0.0
      - fa2==0.3.5  # ForceAtlas2 layout for UMAP visualisation
      - scrublet==0.2.3  # Doublet detection (for QC section in §2.1)
      - harmonypy==0.0.9  # Harmony baseline comparison in §2.10
      - scib==1.1.7  # scIB batch-effect metrics (silhouette of dataset_id)
      - decoupler-py==1.6.0  # KEGG pathway enrichment (§3.6.6)
      - gseapy==1.1.3  # ssGSEA implementation (§3.6.5)
      - gprofiler==1.0.0  # Alternative GO/KEGG enrichment (cross-check)

variables:
  PYTHONHASHSEED: "42"  # Pin Python hash seed for deterministic dict ordering
  PYTHONUNBUFFERED: "1"  # Unbuffered stdout/stderr for real-time logging
  HDF5_USE_FILE_LOCKING: "FALSE"  # Required for concurrent reads on NFS
  OMP_NUM_THREADS: "8"  # OpenMP thread cap (overridable on HPC)
  MKL_NUM_THREADS: "8"
  CUBLAS_WORKSPACE_CONFIG: ":4096:8"  # cuBLAS deterministic workspace
  TF_CPP_MIN_LOG_LEVEL: "2"  # Suppress TF info/warn if ESM-2 is loaded
